<!DOCTYPE html>
<html>
<head>
    <title>Performance Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h2 {
            color: #000000;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            background: #ffffff;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        img {
            margin-top: 20px;
            max-width: 90%;
            border: 3px solid #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #333;
            border-radius: 5px;
            transition: 0.3s;
        }
        a:hover {
            background-color: #222;
        }
    </style>
</head>
<body>
    <h2>Performance Analysis for {{ name }}</h2>
    <p>Status: {{ status }}</p>
    <br>
    <img src="data:image/png;base64,{{ graph_url }}" alt="Performance Graph">
    <br><br>
    <a href="/employee_dashboard">Back</a>
</body>
</html>
